# Fill-in runs for the remaining 3 models
provider: openai

key_groups:
  key1:
    env: OPENAI_API_KEY
    models:
      - gpt-realtime
      - gpt-realtime-1.5
  key2:
    env: OPENAI_API_KEY_2
    models:
      - gpt-4o-realtime-preview-2025-06-03

match_modes:
  - lenient

task_sets:
  reactive: data/tasks/reactive
  strong: data/tasks/proactive/strong_v2
  medium: data/tasks/proactive/medium_v2
  weak: data/tasks/proactive/weak_v2
