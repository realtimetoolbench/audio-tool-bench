# Audio Tool Bench evaluation config
# Usage: python3 scripts/run_benchmark.py --config benchmark.yaml [--eval-only]

provider: openai

# Group models by API key. Groups run in parallel; models inside a group run serially.
# Each group may specify its own provider (defaults to the top-level provider).
key_groups:
  key1:
    env: OPENAI_API_KEY
    models:
      - gpt-realtime-mini
      - gpt-realtime
      - gpt-realtime-1.5
  key2:
    env: OPENAI_API_KEY_2
    models:
      - gpt-4o-realtime-preview-2024-12-17
      - gpt-4o-realtime-preview-2025-06-03
  # Gemini example:
  # gemini:
  #   env: GOOGLE_API_KEY
  #   provider: gemini
  #   models:
  #     - gemini-live-2.5-flash-native-audio

match_modes:
  - lenient

task_sets:
  reactive: data/tasks/reactive
  strong: data/tasks/proactive/strong_v2
  medium: data/tasks/proactive/medium_v2
  weak: data/tasks/proactive/weak_v2
